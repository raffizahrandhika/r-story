    <script src="script.js"></script>

    <script>
        // --- DATA CERITA ---
        const storyData = [
            {
                title: "Chapter 1: Jalan yang Berubah",
                date: "26 Feb 2025",
                content: `
                    <p>Matahari siang itu terasa lebih menyengat dari biasanya. Cahayanya memantul ganas di atas aspal lapangan sekolah yang mulai retak-retak. Rafa menyeka keringat yang menetes di pelipisnya, matanya menyipit menatap gerbang sekolah yang terbuka lebar. Di sinilah semuanya bermula, pikirnya. Bukan dengan drama besar atau kembang api, melainkan dengan keheningan siang bolong yang dipecahkan oleh suara bel pulang sekolah.</p>
                    <p>"Raf! Woy, melamun aja lo!" seru Dika sambil menepuk bahu Rafa keras-keras. Rafa tersentak, lamunannya tentang masa depan yang abstrak seketika buyar digantikan wajah Dika yang cengengesan. "Anak-anak mau nongkrong di warung Bu Tin, ikut gak?" tanyanya. Rafa menggeleng pelan, "Gue mau langsung balik, ada yang harus gue kerjain." Dika hanya mengangkat bahu, "Yaudah, jangan terlalu serius jadi orang, Raf. Nanti cepet tua."</p>
                `
            },
            {
                title: "Chapter 2: Melangkah Sendiri",
                date: "05 Mar 2025",
                content: `
                    <p>Perjalanan pulang selalu menjadi momen favorit Rafa. Di dalam angkot yang berdesak-desakan, ia justru menemukan kesendiriannya. Ia mengamati orang-orang: ibu-ibu yang sibuk menghitung belanjaan, bapak tua yang tertidur dengan mulut terbuka, dan anak kecil yang menangis minta es krim. Bagi Rafa, mereka adalah potongan-potongan cerita yang belum selesai ditulis.</p>
                    <p>Ia mengeluarkan buku catatan kecil dari tasnya. Di sana, ia mulai menuliskan apa yang ia lihat. "Bayang-bayang siang tidak pernah berbohong," tulisnya. "Ia selalu jatuh tepat di tempat kita berdiri, mengingatkan bahwa lari dari kenyataan itu percuma." Pena hitamnya menari-nari di atas kertas, mengabaikan guncangan angkot yang melewati jalan berlubang. Bagi Rafa, dunia ini terlalu bising jika tidak diredam dengan tulisan.</p>
                `
            },
            {
                title: "Chapter 3: Langit Masih Sama",
                date: "12 Mar 2025",
                content: `
                    <p>Sampai di rumah, langit mulai berubah warna menjadi jingga keunguan. Rafa duduk di teras, menatap perubahan warna langit yang perlahan namun pasti. Ada rasa lelah yang aneh menyergap dadanya. Bukan lelah fisik, melainkan lelah memikirkan "mau jadi apa" setelah lulus nanti. Pertanyaan itu seperti hantu yang terus membayangi setiap langkah kakinya di bawah terik matahari.</p>
                    <p>Tiba-tiba ponselnya bergetar. Sebuah pesan masuk dari nomor tak dikenal. Isinya singkat namun cukup membuat jantung Rafa berdegup kencang: "Tulisanmu di mading sekolah... aku suka. Jangan berhenti." Rafa tersenyum tipis. Mungkin, hanya mungkin, jejak-jejak kecil yang ia buat di bawah terik matahari ini tidak sia-sia. Senja itu menutup hari dengan sebuah harapan baru.</p>
                `
            }
        ];

        // --- LOGIC NAVIGASI ---
        let currentChapter = 0;
        const STORY_KEY = 'rstory-progress-story1';

        const display = document.getElementById('chapterDisplay');
        const select = document.getElementById('chapterSelect');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');

        document.addEventListener('DOMContentLoaded', () => {
            loadProgress();
            populateDropdown();
            renderChapter(currentChapter);
        });

        function loadProgress() {
            const saved = localStorage.getItem(STORY_KEY);
            if (saved !== null) currentChapter = parseInt(saved);
        }

        function saveProgress() {
            localStorage.setItem(STORY_KEY, currentChapter);
        }

        function populateDropdown() {
            storyData.forEach((chapter, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.text = chapter.title;
                select.appendChild(option);
            });
        }

        function renderChapter(index) {
            const chapter = storyData[index];
            display.innerHTML = `
                <h2 class="chapter-title">${chapter.title}</h2>
                <div class="chapter-text">${chapter.content}</div>
            `;
            // Set publish date in header
            const headerDate = document.getElementById('readTime');
            if (headerDate && chapter.date) headerDate.textContent = chapter.date;
            select.value = index;
            prevBtn.disabled = index === 0;
            if (index === 0) prevBtn.classList.add('disabled'); else prevBtn.classList.remove('disabled');

            if (index === storyData.length - 1) {
                nextBtn.innerHTML = 'Selesai <i class="fas fa-check"></i>';
            } else {
                nextBtn.innerHTML = 'Selanjutnya <i class="fas fa-arrow-right"></i>';
                nextBtn.disabled = false;
            }

            const progress = ((index + 1) / storyData.length) * 100;
            progressBar.style.width = `${progress}%`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            saveProgress();
        }

        function changeChapter(direction) {
            const newIndex = currentChapter + direction;
            if (newIndex >= 0 && newIndex < storyData.length) {
                currentChapter = newIndex;
                renderChapter(currentChapter);
            }
        }

        function jumpToChapter() {
            currentChapter = parseInt(select.value);
            renderChapter(currentChapter);
        }
    </script>
</body>
